name: Post to Instagram

on:
  schedule:
    - cron: '0 15 * * 1,3,5'   # Mon/Wed/Fri 15:00 UTC. Edit to change your schedule.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Draft only (do not post to Instagram)'
        type: boolean
        default: true
      post_type:
        description: 'Post type (auto follows the guideEvery rotation)'
        type: choice
        options: [auto, tips, guide]
        default: auto
      format:
        description: 'Post format (leave on "config" to use postFormat from account.json)'
        type: choice
        options: [config, carousel, reel, both]
        default: config

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      # Manual runs follow the dry_run checkbox.
      # Scheduled runs only post for real when the repo variable AUTO_POST is 'true'.
      POST_FORMAT: ${{ github.event_name == 'workflow_dispatch' && inputs.format != 'config' && inputs.format || '' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true || github.event_name != 'workflow_dispatch' && vars.AUTO_POST != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install fonts and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-liberation ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Generate post (caption + image)
        run: node generate.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POST_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.post_type != 'auto' && inputs.post_type || '' }}

      - name: Commit images so Instagram can fetch them
        run: |
          if [ "$DRY_RUN" = "true" ]; then DIRS="drafts reels-drafts"; else DIRS="images reels"; fi
          git config user.name "instagram-agent"
          git config user.email "instagram-agent@users.noreply.github.com"
          for d in $DIRS; do if [ -d "$d" ]; then git add "$d"; fi; done
          git commit -m "Add post media" || echo "Nothing to commit"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Publish (or preview if dry run)
        run: node publish.js
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}

      - name: Upload reel preview
        if: ${{ !cancelled() && env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: reel-preview
          path: reels-drafts/*.mp4
          if-no-files-found: ignore

      - name: Save post history
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        run: |
          git add history.json
          git commit -m "Log published post" || echo "Nothing to commit"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

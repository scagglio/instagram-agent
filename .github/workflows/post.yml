name: Post to Instagram

on:
  schedule:
    - cron: '0 15 * * 1,4'  # Mondays and Thursdays, 15:00 UTC — edit to taste
  workflow_dispatch: {}      # lets you trigger a run manually from the Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Generate caption + image
        run: npm run generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CANVA_API_TOKEN: ${{ secrets.CANVA_API_TOKEN }}

      - name: Publish to Instagram
        run: npm run publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
